[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backnest"
version = "0.1.3"
description = "Python client for Backnest — agent-native backtesting infrastructure — local strategy backtesting via WS <-> WASM simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "backnest-rust-engine",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["backnest*"]
